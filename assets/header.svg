  <text x="56" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="13" font-weight="600" fill="#00d4ff" letter-spacing="2">SOFTWARE ENGINEER / FULL STACK DEVELOPER</text>

