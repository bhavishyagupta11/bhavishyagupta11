<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="expBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="900" height="200" rx="8" fill="url(#expBg)" stroke="#30363d" stroke-width="1.2" />

  <!-- Top Bar -->
  <rect x="0" y="0" width="900" height="32" rx="8" fill="#161b22" />
  <rect x="0" y="24" width="900" height="8" fill="#161b22" />
  <line x1="0" y1="32" x2="900" y2="32" stroke="#30363d" stroke-width="1" />
  <text x="24" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1.5">07 // PROFESSIONAL ENGINEERING EXPERIENCE</text>
  <text x="876" y="21" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="10.5" fill="#58a6ff" letter-spacing="1">ROLE // SDE INTERN</text>

  <!-- Company & Role Header -->
  <g transform="translate(28, 48)">
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="16" font-weight="800" fill="#f0f6fc">Ghai Technologies Private Limited</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="11" font-weight="600" fill="#00d4ff">SOFTWARE DEVELOPMENT INTERN (SDE INTERN)</text>
    
    <rect x="680" y="4" width="164" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
    <text x="762" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="9.5" fill="#8b949e">FEB 2026 – JUL 2026</text>
  </g>

  <!-- Milestone Grid (3 Columns) -->
  <g transform="translate(28, 100)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="270" height="76" rx="5" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
    <rect x="0" y="0" width="3" height="76" rx="1.5" fill="#58a6ff" />
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="9.5" font-weight="700" fill="#58a6ff">15+ UI MODULES BUILT</text>
    <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">Engineered responsive pages and</text>
    <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">reusable component libraries.</text>
    <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="8.5" fill="#8b949e">React.js · Mobile Responsiveness</text>

    <!-- Column 2 -->
    <rect x="286" y="0" width="270" height="76" rx="5" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
    <rect x="286" y="0" width="3" height="76" rx="1.5" fill="#00ff41" />
    <text x="300" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="9.5" font-weight="700" fill="#00ff41">8+ REST APIs INTEGRATED</text>
    <text x="300" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">Integrated OAuth auth, membership</text>
    <text x="300" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">models, and payment gateways.</text>
    <text x="300" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="8.5" fill="#8b949e">RESTful APIs · OAuth · Payments</text>

    <!-- Column 3 -->
    <rect x="572" y="0" width="272" height="76" rx="5" fill="#0d1117" stroke="#30363d" stroke-width="0.8" />
    <rect x="572" y="0" width="3" height="76" rx="1.5" fill="#bf5fff" />
    <text x="586" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="9.5" font-weight="700" fill="#bf5fff">40+ RESOLVED ISSUES</text>
    <text x="586" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">Fixed UI/functional regressions and</text>
    <text x="586" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">optimized Git Agile workflows.</text>
    <text x="586" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="8.5" fill="#8b949e">Agile SDLC · Git · Code Quality</text>
  </g>
</svg>
