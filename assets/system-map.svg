<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" rx="8" fill="url(#mapBg)" stroke="#30363d" stroke-width="1.2" />
  <rect width="900" height="360" rx="8" fill="url(#dotGrid)" />

  <!-- Top System Header -->
  <rect x="0" y="0" width="900" height="32" rx="8" fill="#161b22" />
  <rect x="0" y="24" width="900" height="8" fill="#161b22" />
  <line x1="0" y1="32" x2="900" y2="32" stroke="#30363d" stroke-width="1" />
  <text x="24" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1.5">04 // SYSTEM ARCHITECTURE &amp; CAPABILITIES MAP</text>
  <text x="876" y="21" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="10.5" fill="#00d4ff" letter-spacing="1">GRAPH-V2.4 // 4 CORE MODULES</text>

  <!-- Root Node (Center-Left) -->
  <g transform="translate(36, 140)">
    <rect width="180" height="80" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
    <rect width="180" height="22" rx="6" fill="#1f242c" />
    <rect y="16" width="180" height="6" fill="#1f242c" />
    <line x1="0" y1="22" x2="180" y2="22" stroke="#30363d" stroke-width="1" />
    <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="9" font-weight="700" fill="#58a6ff" letter-spacing="1">ROOT NODE</text>
    <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Bhavishya Gupta</text>
    <text x="12" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="9.5" fill="#8b949e">Core Engineering</text>
  </g>

  <!-- Trunk Lines -->
  <path d="M 216 180 L 260 180" fill="none" stroke="#58a6ff" stroke-width="1.5" />
  <path d="M 260 180 L 260 85 L 290 85" fill="none" stroke="#00d4ff" stroke-width="1.2" />
  <path d="M 260 180 L 260 150 L 290 150" fill="none" stroke="#00ff41" stroke-width="1.2" />
  <path d="M 260 180 L 260 215 L 290 215" fill="none" stroke="#bf5fff" stroke-width="1.2" />
  <path d="M 260 180 L 260 280 L 290 280" fill="none" stroke="#ff9500" stroke-width="1.2" />

  <!-- Node 1: Full-Stack Systems -->
  <g transform="translate(290, 52)">
    <rect width="574" height="66" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#00d4ff" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="11.5" font-weight="700" fill="#00d4ff" letter-spacing="1">01. FULL-STACK &amp; DISTRIBUTED ARCHITECTURES</text>
    <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="10" fill="#c9d1d9">
      Node.js · Express.js · REST APIs · React.js · TypeScript · Next.js · Socket.io · JWT · RBAC
    </text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="9" fill="#8b949e">
      Production service pipelines, multi-role dashboards, token-based authentication, bidirectional websockets
    </text>
  </g>

  <!-- Node 2: Algorithmic Problem Solving -->
  <g transform="translate(290, 126)">
    <rect width="574" height="66" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#00ff41" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="11.5" font-weight="700" fill="#00ff41" letter-spacing="1">02. ALGORITHMIC PROBLEM SOLVING</text>
    <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="10" fill="#c9d1d9">
      810+ DSA Solved · LeetCode (1779 Rating, 600+) · Code360 (1506 Rating) · GeeksforGeeks (120+)
    </text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="9" fill="#8b949e">
      Dynamic programming, graph algorithms, asymptotic analysis, competitive programming benchmarks
    </text>
  </g>

  <!-- Node 3: AI & Machine Learning Systems -->
  <g transform="translate(290, 200)">
    <rect width="574" height="66" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#bf5fff" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="11.5" font-weight="700" fill="#bf5fff" letter-spacing="1">03. AI &amp; MACHINE LEARNING SYSTEMS</text>
    <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="10" fill="#c9d1d9">
      Multi-Agent RAG · Ollama · TF-IDF + MMR Retrieval · NumPy · Pandas · Scikit-Learn · TensorFlow
    </text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="9" fill="#8b949e">
      Autonomous agent routing, grounding verification, neural network training, statistical modeling
    </text>
  </g>

  <!-- Node 4: Data & Infrastructure -->
  <g transform="translate(290, 274)">
    <rect width="574" height="66" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#ff9500" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="11.5" font-weight="700" fill="#ff9500" letter-spacing="1">04. DATA, CACHING &amp; INFRASTRUCTURE</text>
    <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="10" fill="#c9d1d9">
      MongoDB Atlas · MySQL · Redis &amp; BullMQ · Docker · Docker Compose · Git · GitHub CI/CD · GCP
    </text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="9" fill="#8b949e">
      Asynchronous queue processing, container orchestration, relational schema design, cloud deployments
    </text>
  </g>
</svg>
