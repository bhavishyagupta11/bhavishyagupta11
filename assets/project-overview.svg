  <text x="876" y="21" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="10.5" fill="#58a6ff" letter-spacing="1">INDEX // 03 SYSTEMS</text>

  <!-- Project 1: FutureMedia -->
  <g transform="translate(24, 48)">
