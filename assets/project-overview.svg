    <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ 5 Cooperating Agent Pipelines</text>
    <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ TF-IDF + MMR Context Retrieval</text>
    <text x="16" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ Reranking &amp; Fact Verification</text>
    <text x="16" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ Configurable LLMs (Ollama/APIs)</text>

