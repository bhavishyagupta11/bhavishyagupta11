    <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ 5 Docker Containerized Services</text>
    <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ Redis + BullMQ Async Queues</text>
    <text x="16" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ Socket.io Real-Time Messaging</text>
    <text x="16" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ 40+ REST APIs · JWT Security</text>

