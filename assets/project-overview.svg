    <text x="217" y="26.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="8.5" font-weight="700" fill="#00ff41" letter-spacing="0.5">LIVE DEMO</text>

