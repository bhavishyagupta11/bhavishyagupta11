    <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ 6-Pipeline Approval Ecosystem</text>
    <text x="16" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ Track Personalization Engine</text>
    <text x="16" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="10" fill="#c9d1d9">▸ 40+ Secured REST API Endpoints</text>

