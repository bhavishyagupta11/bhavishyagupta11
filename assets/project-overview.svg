    <text x="214" y="26.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="8.5" font-weight="700" fill="#bf5fff" letter-spacing="0.5">OPEN SOURCE</text>

    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Mono', monospace" font-size="9.5" fill="#58a6ff">Multi-Agent RAG Assistant</text>
